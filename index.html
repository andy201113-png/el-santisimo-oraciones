  <!-- ===== ESTILOS CON VARIABLES CSS ===== -->
  <style>
    :root {
      --bg-body: #0f1a0f;
      --bg-card: #1e2a1e;
      --bg-header: #0f1a0f;
      --bg-input: #2a3a2a;

      --text-secondary: #b0a890;

      --btn-lista-bg: #3a5a3a;

      --btn-volver-bg: #2f3f2f;

      --btn-facebook-bg: #1877F2;
      --btn-facebook-text: #ffffff;
      --btn-whatsapp-bg: #25D366;

      --lectura-blockquote-bg: #1a241a;

      --footer-text: #5a6a5a;
    }

    [data-theme="light"] {
      --bg-body: #f5f0e8;
      --bg-card: #ffffff;
      --bg-header: #f5f0e8;
      --bg-input: #e8e0d8;
      --text-primary: #1a1a1a;
      --text-secondary: #4a4a4a;
      --text-muted: #8a8a8a;
      --border-color: #d4c9b8;
      --shadow-color: rgba(0,0,0,0.15);
      --btn-bg: #e8e0d8;
      --btn-text: #1a1a1a;
      --btn-primary-bg: #c9a05e;
      --btn-primary-text: #1a1a1a;
      --btn-outline-border: #c9a05e;
      --btn-outline-text: #c9a05e;
      --btn-lista-bg: #d4c9b8;
      --btn-lista-text: #1a1a1a;
      --btn-volver-bg: #e8e0d8;
      --btn-volver-text: #1a1a1a;
      --btn-facebook-bg: #1877F2;
      --btn-facebook-text: #ffffff;
      --btn-whatsapp-bg: #25D366;

      --toast-bg: #e8e0d8;
      --toast-text: #1a1a1a;
      --post-bg: #ffffff;
      --post-shadow: rgba(0,0,0,0.1);
      --lectura-blockquote-bg: #f0ece6;
      --footer-border: #d4c9b8;
      --footer-text: #6a6a6a;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg-body);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding:16px 16px 30px;
      line-height:1.6;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .container { max-width:680px; margin:0 auto; width:100%; flex:1; }

    /* --- Header --- */
    .header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:12px; flex-wrap:wrap; gap:10px;
    }
    .header h1 { font-size:22px; font-weight:600; color:#c9a05e; letter-spacing:1px; }
    .header .app-badge {
      background:#c9a05e; color:#0f1a0f;
      padding:6px 14px; border-radius:30px;
      font-size:14px; font-weight:600;
      text-decoration:none; display:inline-flex;
      align-items:center; gap:6px;
      border:none; cursor:pointer;
      transition:background .2s;
    }
    .header .app-badge:hover { background:#dbb87a; }

    /* --- Botón de cambio de tema --- */
    .theme-toggle {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .theme-toggle:hover { background: var(--border-color); }

    /* --- Botones generales --- */
    .btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, color .2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex: 1 1 auto;
      justify-content: center;
      min-height: 56px;
    }
    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--btn-outline-border);
      color: var(--btn-outline-text);
    }
    .btn-outline:hover { background: var(--btn-bg); }
    .btn-lista {
      background: var(--btn-lista-bg);
      color: var(--btn-lista-text);
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex: 1 1 auto;
      justify-content: center;
      min-height: 56px;
    }
    .btn-lista:hover { filter: brightness(1.1); }
    .btn-volver {
      background: var(--btn-volver-bg);
      color: var(--btn-volver-text);
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex: 1 1 auto;
      justify-content: center;
      min-height: 56px;

    /* --- Botones de comunidades --- */
    .btn-facebook {
      background: var(--btn-facebook-bg);
      color: var(--btn-facebook-text);
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;

      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex: 1 1 auto;
      justify-content: center;
      min-height: 56px;

    .btn-facebook:hover {

    #adBannerContainer {

    /* --- Contenido dinámico --- */
    #dynamicContent {
      background: var(--bg-card);

    .video-wrapper {
      margin:12px 0 16px;
      border-radius:12px; overflow:hidden;
      background:#0a120a; display:flex; justify-content:center;

    .video-wrapper video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }
    .action-buttons-inline {
      display:flex; flex-wrap:wrap; gap:12px;
      margin: 12px 0 16px;
      justify-content:center;
    }

    /* --- Feed --- */
    .feed { display:flex; flex-direction:column; gap:16px; }
    .post {
      background: var(--post-bg);
      border-radius:12px; overflow:hidden;
      box-shadow:0 2px 8px var(--post-shadow);
      cursor:pointer; transition:transform .15s;
    }
    .post:hover { transform:scale(1.01); }
    .post img {
      width:100%; height:auto; display:block; aspect-ratio:16/9;
      object-fit:cover; background:#0a120a;
    }
    .post-content { padding:14px 16px; }
    .post-content h3 { color:#c9a05e; font-size:18px; margin-bottom:4px; }
    .post-content p { color: var(--text-secondary); font-size:15px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .post .leer-mas { display:block; text-align:right; color:#c9a05e; font-weight:600; margin-top:6px; font-size:14px; }
    .loader { text-align:center; padding:16px; color: var(--text-muted); }
    .loader.hidden { display:none; }

    /* --- Lectura --- */
    .lectura-content { color: var(--text-primary); }
    .lectura-content h3 { color:#c9a05e; margin:16px 0 8px; }
    .lectura-content .referencia { color:#c9a05e; font-weight:600; }
    .lectura-content blockquote {
      background: var(--lectura-blockquote-bg);
      border-left:4px solid #c9a05e;
      padding:12px 16px; margin:12px 0; border-radius:0 8px 8px 0;
      font-style:italic;
      color: var(--text-primary);
    }

    /* --- Footer --- */
    .footer {
      text-align:center; font-size:13px;
      color: var(--footer-text);
      margin-top:20px; border-top:1px solid var(--footer-border);

    .footer a { color:#c9a05e; text-decoration:none; }
    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 12px 0;
    }

    /* --- Toast --- */
    .toast {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      background: var(--toast-bg);
      color: var(--toast-text);
      padding:12px 24px;
      border-radius:30px; font-size:15px;
      box-shadow:0 4px 16px var(--shadow-color);
      opacity:0; transition:opacity 0.4s ease; pointer-events:none;
      z-index:999; border:1px solid #c9a05e;
      max-width:90%; text-align:center;
    }
    .toast.visible { opacity:1; }

    /* --- Botones de instalación y notificaciones --- */
    #btnInstalar, #btnIos, #btnNotificaciones {
      display: none;
      margin: 4px 0;
      font-size:18px;
      padding:16px 28px;
      min-height:60px;
    }
    #btnNotificaciones {
      display: inline-flex;
    }

    @media (max-width:400px) {
      .header h1 { font-size:18px; }
      .header .app-badge { font-size:12px; padding:4px 12px; }
      #dynamicContent { padding:16px; }
      .btn, .btn-lista, .btn-volver, .btn-facebook, .btn-whatsapp {
        font-size:15px; padding:12px 18px; min-height:48px;
      }
      #btnInstalar, #btnIos, #btnNotificaciones { font-size:16px; padding:14px 20px; min-height:54px; }
      .theme-toggle { font-size:16px; padding:6px 12px; }
      #adBannerContainer { min-height:250px; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">

<div id="adBannerContainer" style="max-width:350px; margin: 0 auto 12px auto; padding: 10px 16px; background: var(--bg-input); border-radius:10px; border:1px solid var(--border-color); text-align:center; min-height: auto !important;">

</div>

  <!-- BOTONES DE INSTALACIÓN PWA Y NOTIFICACIONES (DEBAJO DEL BANNER) -->
  <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px;">

        👥 Comunidad en Facebook
      </a>

      </a>
    </div>
    <p>📲 ¿Quieres todas las oraciones sin anuncios?<br>
    <a href="#" id="downloadAppFooter">Descarga nuestra app gratuita</a></p>

  <div class="toast" id="toast"></div>
</div>

<script>
  // ============================================================
  // 1. FUNCIONES DEL TEMA (modo claro/oscuro)
  // ============================================================
  (function themeManager() {
    const themeToggle = document.getElementById('themeToggle');
    const STORAGE_KEY = 'elsantisimo-theme';

    function getPreferredTheme() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored === 'light' || stored === 'dark') return stored;
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        return 'light';
      }
      return 'dark';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem(STORAGE_KEY, theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      showToast(next === 'dark' ? '🌙 Modo oscuro activado' : '☀️ Modo claro activado');
    }

    const initialTheme = getPreferredTheme();
    applyTheme(initialTheme);
    themeToggle.addEventListener('click', toggleTheme);

    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
      if (!localStorage.getItem(STORAGE_KEY)) {
        applyTheme(e.matches ? 'light' : 'dark');
      }
    });
  })();

  // ============================================================
  // 2. LÓGICA DE ORACIONES, LISTA, LECTURA
  // ============================================================
  (function() {
    const ORACIONES_URL = 'https://oraciones-api.vercel.app/oraciones.json';
    const LECTURAS_URL = 'https://oraciones-api.vercel.app/lecturas.json';
    const APP_URL = 'https://play.google.com/store/apps/details?id=com.elsantisimoteespera.oracionesdiarias';
    const BATCH_SIZE = 8;

    const dynamicContent = document.getElementById('dynamicContent');
    const toast = document.getElementById('toast');
    const adContainer = document.getElementById('adBannerContainer');

    let state = {
      view: 'single',
      oracionActual: null,
      allOraciones: [],
      listIndex: 0,
      lecturaData: null,
    };

    function saveState() {
      try {
        const toStore = { view: state.view, listIndex: state.listIndex };
        localStorage.setItem('oraciones_state', JSON.stringify(toStore));
      } catch (e) {}
    }

    function loadState() {
      try {
        const stored = localStorage.getItem('oraciones_state');
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      return null;
    }

    // Scroll al inicio de la página para mostrar el banner primero
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 3500);
    }

    function updateUrl(oracion) {
      if (!oracion || !oracion.id) return;
      const url = new URL(window.location);
      url.searchParams.set('id', oracion.id);
      window.history.pushState({}, '', url);
    }

    function getOracionIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      return id ? parseInt(id) : null;
    }

    function compartirOracion(oracion) {
      if (!oracion) {
        showToast('❌ No hay oración para compartir');
        return;
      }
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = baseUrl + '?id=' + oracion.id;
      const titulo = oracion.titulo || 'Oración del día';
      const extracto = oracion.extracto || 'Una oración para el alma';
      const textoLimpio = oracion.textoCompleto
        ? oracion.textoCompleto.replace(/<[^>]*>/g, '').substring(0, 500) + '...'
        : extracto;
      const shareData = {
        title: titulo,
        text: `🕯️ ${titulo}\n\n${textoLimpio}\n\n🙏 Comparte esta oración con alguien que la necesite.`,
        url: shareUrl,
      };
      if (navigator.share) {
        navigator.share(shareData)
          .then(() => showToast('✅ ¡Compartido con éxito!'))
          .catch((err) => {
            if (err.name !== 'AbortError') {
              console.error('Error al compartir:', err);
              fallbackCompartir(shareData);
            }
          });
      } else {
        fallbackCompartir(shareData);
      }
    }

    function fallbackCompartir(shareData) {
      const textoCompleto = `${shareData.title}\n\n${shareData.text}\n\n${shareData.url}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(textoCompleto)
          .then(() => showToast('📋 Enlace copiado al portapapeles. ¡Compártelo!'))
          .catch(() => copiarTextoAlternativo(textoCompleto));
      } else {
        copiarTextoAlternativo(textoCompleto);
      }
    }

    function copiarTextoAlternativo(texto) {
      const textarea = document.createElement('textarea');
      textarea.value = texto;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('📋 Enlace copiado al portapapeles. ¡Compártelo!');
      } catch (e) {
        showToast('💡 Copia el enlace manualmente desde la barra de direcciones.');
      }
      document.body.removeChild(textarea);
    }

    // 🔥 Función para refrescar el banner (recrea el contenedor para forzar nueva impresión)
    function refreshBanner() {
      // Si el banner tiene un script de Adsterra, lo recreamos
      const placeholder = adContainer.querySelector('.ad-placeholder');
      if (placeholder) {
        // Guardamos el HTML actual del banner
        const currentHTML = placeholder.innerHTML;
        // Lo reemplazamos con el mismo contenido para forzar recarga
        placeholder.innerHTML = currentHTML;
        // Si Adsterra usa scripts, podemos intentar re-ejecutarlos
        // (esto depende del tipo de anuncio)
      }
    }

    // ===== RENDER VISTA SINGLE =====
    function renderSingleView(oracion) {
      state.view = 'single';
      state.oracionActual = oracion;
      saveState();
      updateUrl(oracion);

      // Refrescamos el banner al cambiar de oración
      refreshBanner();

      let html = '';

      // Título y extracto
      if (oracion.titulo) {
        html += `<h2 style="color:#c9a05e; text-align:center; margin-bottom:6px; font-size:24px;">${oracion.titulo}</h2>`;
      }
      if (oracion.extracto) {
        html += `<p style="text-align:center; color:var(--text-secondary); font-size:16px; margin-bottom:12px;">${oracion.extracto}</p>`;
      }

      // Video
      if (oracion.urlVideo) {
        html += `<div class="video-wrapper"><video controls playsinline preload="metadata"><source src="${oracion.urlVideo}" type="video/mp4">Tu navegador no soporta video.</video></div>`;
      }

      // Botones de acción
      html += `
        <div class="action-buttons-inline">
          <button id="btnAleatoria" class="btn btn-outline">🔄 Otra oración</button>
          <button id="btnLista" class="btn-lista">📚 Ver todas las oraciones</button>
          <button id="btnCompartir" class="btn btn-primary">🙏 Compartir esta oración</button>
          <button id="btnLectura" class="btn btn-outline">📖 Lectura bíblica del día</button>
        </div>
      `;

      // Texto completo
      if (oracion.textoCompleto) {
        html += `<div class="oracion-texto">${oracion.textoCompleto}</div>`;
      }

      if (!oracion.titulo && !oracion.extracto && !oracion.urlVideo && !oracion.textoCompleto) {
        html = '<p style="text-align:center; color:var(--text-muted); padding:20px;">Contenido no disponible.</p>';
      }

      dynamicContent.innerHTML = html;

      // Asignar eventos a los botones
      const btnAleatoria = document.getElementById('btnAleatoria');
      const btnLista = document.getElementById('btnLista');
      const btnCompartir = document.getElementById('btnCompartir');
      const btnLectura = document.getElementById('btnLectura');

      if (btnAleatoria) {
        btnAleatoria.addEventListener('click', function(e) {
          e.preventDefault();
          if (state.allOraciones.length === 0) return;
          const random = state.allOraciones[Math.floor(Math.random() * state.allOraciones.length)];
          renderSingleView(random);
          scrollToTop();
          showToast('🔄 Nueva oración cargada');
        });
      }

      if (btnLista) {
        btnLista.addEventListener('click', function(e) {
          e.preventDefault();
          state.listIndex = 0;
          renderListView();
          scrollToTop();
        });
      }

      if (btnCompartir) {
        btnCompartir.addEventListener('click', function(e) {
          e.preventDefault();
          compartirOracion(state.oracionActual);
        });
      }

      if (btnLectura) {
        btnLectura.addEventListener('click', function(e) {
          e.preventDefault();
          renderLectureView();
          scrollToTop();
        });
      }
    }

    // ===== VISTA LISTA =====
    function renderListView() {
      state.view = 'list';
      saveState();
      const url = new URL(window.location);
      url.searchParams.delete('id');
      window.history.pushState({}, '', url);

      // Refrescamos el banner al entrar en lista
      refreshBanner();

      let html = `
        <div style="margin-bottom:12px;">
          <button id="backToSingleBtn" class="btn-volver">← Volver a la oración del día</button>
        </div>
        <p style="text-align:center; color:var(--text-secondary); margin-bottom:12px; font-size:15px;">
          📚 Haz clic en cualquier oración para leerla completa
        </p>
        <div class="feed" id="feedContainer"></div>
        <div class="loader" id="loader">Cargando más oraciones...</div>
      `;
      dynamicContent.innerHTML = html;

      const backBtn = document.getElementById('backToSingleBtn');
      if (backBtn) {
        backBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const destacada = state.allOraciones.find(o => o.destacado === true);
          renderSingleView(destacada || state.allOraciones[0]);
          scrollToTop();
        });
      }

      loadNextBatch();
      window.removeEventListener('scroll', onScroll);
      window.addEventListener('scroll', onScroll);
    }

    // ===== CARGA POR LOTES =====
    function loadNextBatch() {
      const feed = document.getElementById('feedContainer');
      const loader = document.getElementById('loader');
      if (!feed) return;

      if (state.listIndex >= state.allOraciones.length) {
        if (loader) loader.classList.add('hidden');
        return;
      }

      const batch = state.allOraciones.slice(state.listIndex, state.listIndex + BATCH_SIZE);
      state.listIndex += batch.length;
      saveState();

      batch.forEach(oracion => {
        const post = document.createElement('div');
        post.className = 'post';
        post.addEventListener('click', function() {
          renderSingleView(oracion);
          scrollToTop();
          showToast('📖 Cargando oración...');
        });

        if (oracion.urlImagen) {
          const img = document.createElement('img');
          img.src = oracion.urlImagen;
          img.alt = oracion.titulo || 'Oración';
          img.loading = 'lazy';
          post.appendChild(img);
        }

        const content = document.createElement('div');
        content.className = 'post-content';
        const title = document.createElement('h3');
        title.textContent = oracion.titulo || 'Oración';
        content.appendChild(title);

        const excerpt = document.createElement('p');
        excerpt.textContent = oracion.extracto || 'Haz clic para leer la oración completa.';
        content.appendChild(excerpt);

        const readMore = document.createElement('span');
        readMore.className = 'leer-mas';
        readMore.textContent = 'Ver oración →';
        content.appendChild(readMore);

        post.appendChild(content);
        feed.appendChild(post);
      });

      if (state.listIndex >= state.allOraciones.length) {
        if (loader) loader.classList.add('hidden');
      } else {
        if (loader) loader.classList.remove('hidden');
      }
    }

    // ===== SCROLL INFINITO =====
    let scrollTimeout;
    function onScroll() {
      if (state.view !== 'list') {
        window.removeEventListener('scroll', onScroll);
        return;
      }
      if (state.listIndex >= state.allOraciones.length) return;

      const loader = document.getElementById('loader');
      if (!loader || loader.classList.contains('hidden')) return;

      const rect = loader.getBoundingClientRect();
      if (rect.top <= window.innerHeight + 100) {
        if (scrollTimeout) clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          loadNextBatch();
          scrollTimeout = null;
        }, 200);
      }
    }

    // ===== VISTA LECTURA =====
    function renderLectureView() {
      state.view = 'lecture';
      saveState();
      const url = new URL(window.location);
      url.searchParams.delete('id');
      window.history.pushState({}, '', url);

      // Refrescamos el banner al entrar en lectura
      refreshBanner();

      if (!state.lecturaData) {
        dynamicContent.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px;">Cargando lectura del día...</p>`;
        fetch(LECTURAS_URL)
          .then(res => {
            if (!res.ok) throw new Error('Error al cargar lecturas');
            return res.json();
          })
          .then(data => {
            if (Array.isArray(data)) {
              state.lecturaData = data[0] || null;
            } else if (data.lecturas && Array.isArray(data.lecturas)) {
              state.lecturaData = data.lecturas[0] || null;
            } else {
              state.lecturaData = data;
            }
            renderLectureView();
          })
          .catch(err => {
            dynamicContent.innerHTML = `<p style="text-align:center; color:#c9a05e; padding:20px;">❌ No se pudo cargar la lectura.<br><span style="font-size:14px; color:var(--text-muted);">${err.message}</span></p>`;
          });
        return;
      }

      const lect = state.lecturaData;
      let html = `
        <div style="margin-bottom:12px;">
          <button id="backFromLectureBtn" class="btn-volver">← Volver a la oración del día</button>
        </div>
        <div class="lectura-content">
          <h2 style="color:#c9a05e; text-align:center; margin-bottom:8px;">${lect.liturgia || 'Lectura del día'}</h2>
      `;

      if (lect.primera_lectura) {
        html += `<h3>📖 Primera lectura</h3>
          <p class="referencia">${lect.primera_lectura.referencia || ''}</p>
          <blockquote>${lect.primera_lectura.texto || ''}</blockquote>`;
      }
      if (lect.salmo) {
        html += `<h3>🎵 Salmo</h3>
          <p class="referencia">${lect.salmo.referencia || ''}</p>
          <blockquote>${lect.salmo.texto || ''}</blockquote>`;
      }
      if (lect.segunda_lectura) {
        html += `<h3>📖 Segunda lectura</h3>
          <p class="referencia">${lect.segunda_lectura.referencia || ''}</p>
          <blockquote>${lect.segunda_lectura.texto || ''}</blockquote>`;
      }
      if (lect.evangelio) {
        html += `<h3>✝️ Evangelio</h3>
          <p class="referencia">${lect.evangelio.referencia || ''}</p>
          <blockquote>${lect.evangelio.texto || ''}</blockquote>`;
      }
      if (lect.reflexion) {
        html += `<h3>💡 Reflexión</h3>
          <p style="white-space:pre-line;">${lect.reflexion.texto || ''}</p>`;
      }

      html += `</div>`;
      dynamicContent.innerHTML = html;

      const backBtn = document.getElementById('backFromLectureBtn');
      if (backBtn) {
        backBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const destacada = state.allOraciones.find(o => o.destacado === true);
          renderSingleView(destacada || state.allOraciones[0]);
          scrollToTop();
        });
      }
    }

    // ===== INICIALIZACIÓN =====
    function init() {
      fetch(ORACIONES_URL)
        .then(res => {
          if (!res.ok) throw new Error('Error al cargar oraciones');
          return res.json();
        })
        .then(data => {
          state.allOraciones = data.oraciones || [];
          if (!state.allOraciones.length) throw new Error('No hay oraciones');

          const idFromUrl = getOracionIdFromUrl();
          let oracionInicial = null;

          if (idFromUrl) {
            oracionInicial = state.allOraciones.find(o => o.id === idFromUrl);
            if (oracionInicial) {
              state.oracionActual = oracionInicial;
              renderSingleView(oracionInicial);
              scrollToTop();
              return;
            }
          }

          const saved = loadState();
          if (saved && saved.view === 'list') {
            state.view = 'list';
            state.listIndex = saved.listIndex || 0;
            renderListView();
            return;
          } else if (saved && saved.view === 'lecture') {
            state.view = 'lecture';
            renderLectureView();
            return;
          }

          const destacada = state.allOraciones.find(o => o.destacado === true);
          oracionInicial = destacada || state.allOraciones[0];
          state.oracionActual = oracionInicial;
          state.view = 'single';
          renderSingleView(oracionInicial);
          scrollToTop();
        })
        .catch(err => {
          dynamicContent.innerHTML = `<p style="text-align:center; color:#c9a05e; padding:30px;">❌ Error al cargar las oraciones.<br><span style="font-size:14px; color:var(--text-muted);">${err.message}</span></p>`;
          console.error(err);
        });
    }

    function abrirApp() {
      window.open(APP_URL, '_blank');
    }

    document.getElementById('downloadAppBtn').addEventListener('click', function(e) {
      e.preventDefault();
      abrirApp();
    });

    document.getElementById('downloadAppFooter').addEventListener('click', function(e) {
      e.preventDefault();
      abrirApp();
    });

    window.addEventListener('popstate', function() {
      const id = getOracionIdFromUrl();
      if (id) {
        const oracion = state.allOraciones.find(o => o.id === id);
        if (oracion) {
          renderSingleView(oracion);
          return;
        }
      }
      const destacada = state.allOraciones.find(o => o.destacado === true);
      if (destacada) renderSingleView(destacada);
    });

    init();
  })();
